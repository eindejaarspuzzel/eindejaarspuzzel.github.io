<html>
<body>

<form id="signup">
  <label for="email">Email address</label>
  <input type="email" id="email" name="email" required maxlength="254" autocomplete="email">
  <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
  <input type="hidden" name="_subject" value="New signup">
  <input type="hidden" name="_captcha" value="false">
  <button type="submit">Submit</button>
</form>
<p id="status" role="status" aria-live="polite"></p>

<script>
document.getElementById('signup').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, status = document.getElementById('status');
  try {
    const r = await fetch('https://formsubmit.co/ajax/eindejaarspuzzel@gmail.com', {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    });
    const j = await r.json();
    if (!r.ok || j.success === 'false') throw new Error();
    form.style.display = 'none';
    status.textContent = 'Thank you, your address has been received.';
  } catch {
    status.textContent = 'Something went wrong. Please try again later.';
  }
});
</script>

</body>
</html>
